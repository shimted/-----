<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메롱의 영어 공부 계획표</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #ff536b;
    --primary-dark: #ff2553;
    --primary-tint: #ffe9ec;
    --ink: #171717;
    --text: #212121;
    --muted: #757575;
    --border: #e7e7e7;
    --bg: #ffffff;
    --card: #ffffff;
    --danger: #d92d20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0;
  }
  .hero {
    background: var(--ink);
    padding: 48px 16px 92px;
    text-align: center;
  }
  .hero .eyebrow {
    display: inline-block;
    background: rgba(255, 83, 107, 0.18);
    color: var(--primary);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .container {
    max-width: 720px;
    margin: -60px auto 0;
    padding: 0 16px 60px;
    position: relative;
    z-index: 1;
  }
  h1 {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.35;
    color: #fff;
    margin: 0 0 10px;
  }
  h1 .highlight { color: var(--primary); }
  .subtitle {
    text-align: center;
    color: #c9c9c9;
    margin: 0;
    font-size: 15px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 24px;
    margin-bottom: 20px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.08);
  }
  .field {
    margin-bottom: 22px;
  }
  .field label.field-title {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 15px;
  }
  .field .hint {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-tint);
  }
  .interest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .interest-item {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13.5px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .interest-item:hover { background: var(--primary-tint); }
  .interest-item.checked {
    background: var(--primary-tint);
    border-color: var(--primary);
    color: var(--primary-dark);
    font-weight: 700;
  }
  .interest-item input { accent-color: var(--primary); }
  .interest-counter {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .error-box {
    display: none;
    background: #fff1f0;
    border: 1px solid #ffc7c2;
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(255, 83, 107, 0.35);
    transition: background 0.15s, transform 0.1s;
  }
  .submit-btn:hover { background: var(--primary-dark); }
  .submit-btn:active { transform: scale(0.99); }
  .secondary-btn {
    display: inline-block;
    padding: 12px 22px;
    background: #fff;
    color: var(--primary-dark);
    border: 1.5px solid var(--primary);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 20px;
  }
  .secondary-btn:hover { background: var(--primary-tint); }

  #result-screen { display: none; }

  .summary-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip {
    background: var(--primary-tint);
    color: var(--primary-dark);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .level-badge {
    display: inline-block;
    background: var(--ink);
    color: var(--primary);
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .tip-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin: 4px 0;
  }
  .week-card {
    border: 1.5px solid var(--border);
    border-left: 5px solid var(--primary);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .week-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .week-theme {
    color: var(--primary-dark);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  table.day-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
  }
  table.day-table th, table.day-table td {
    border: 1px solid var(--border);
    padding: 8px 4px;
    text-align: center;
  }
  table.day-table th {
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    border-color: var(--ink);
  }
  .interest-note {
    background: var(--primary-tint);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13.5px;
    line-height: 1.7;
  }
  .interest-note strong { color: var(--primary-dark); }
</style>
</head>
<body>
<div class="hero">
  <span class="eyebrow">4주 완성 플랜</span>
  <h1>은반이의 영어 공부 <span class="highlight">계획표</span></h1>
  <p class="subtitle">나이 · 토익 점수 · 공부 경력 · 관심 분야를 입력하면 4주 맞춤 학습 계획을 만들어드려요</p>
</div>
<div class="container">
  <div id="input-screen">
    <div class="card">
      <div class="error-box" id="error-box"></div>

      <div class="field">
        <label class="field-title" for="age-input">나이</label>
        <input type="number" id="age-input" min="5" max="100" placeholder="예: 25">
      </div>

      <div class="field">
        <label class="field-title" for="toeic-input">보유 토익 점수</label>
        <div class="hint">점수가 없다면 비워두세요. (경력을 기준으로 레벨을 추정합니다)</div>
        <input type="number" id="toeic-input" min="0" max="990" placeholder="예: 650 (없으면 비워두기)">
      </div>

      <div class="field">
        <label class="field-title" for="career-input">영어 공부 경력</label>
        <select id="career-input">
          <option value="none">거의 없음</option>
          <option value="under1">1년 미만</option>
          <option value="1to3">1~3년</option>
          <option value="3to5">3~5년</option>
          <option value="over5">5년 이상</option>
        </select>
      </div>

      <div class="field">
        <label class="field-title">흥미 분야 (1개 ~ 5개 선택)</label>
        <div class="hint">계획표에 관심 분야 학습 콘텐츠를 반영해드려요.</div>
        <div class="interest-grid" id="interest-grid"></div>
        <div class="interest-counter" id="interest-counter">선택: 0 / 5</div>
      </div>

      <button class="submit-btn" id="submit-btn">계획표 만들기</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="card">
      <div id="result-summary"></div>
    </div>
    <div id="weeks-container"></div>
    <div style="text-align:center;">
      <button class="secondary-btn" id="restart-btn">다시 만들기</button>
    </div>
  </div>
</div>

    "유학/해외생활": [

    "명상/마인드풀니스": [
      "영어 명상 가이드 영상을 듣고 표현 정리하기",
      "마음챙김 관련 짧은 아티클 읽고 핵심 정리하기",
      "오늘의 감정을 영어 일기로 써보기",
      "나만의 명상 루틴을 영어로 설명해보기"
    ],
    "유튜브·SNS 트렌드": [
      "요즘 유행하는 영어 밈·챌린지 콘텐츠 찾아보기",
      "좋아하는 유튜버 영상 보며 표현 정리하기",
      "SNS에 올릴 영어 캡션을 만들어보기",
      "요즘 트렌드에 대해 영어로 설명해보기"
    ]
  };

  var LEVELS = ["왕초보", "초급", "중급", "중상급", "고급"];

  var LEVEL_WEEK_THEMES = {
    "왕초보": ["알파벳 발음 & 기초 문법 다지기", "생존 필수 단어 익히기", "짧고 쉬운 문장 만들어보기", "배운 내용 복습 & 자기소개 완성"],
    "초급": ["기초 문법 정리 & 핵심 단어 확장", "일상 회화 표현 익히기", "짧은 글 읽고 요약해보기", "배운 표현으로 실전 대화 연습"],
    "중급": ["문법 심화 & 어휘력 확장", "리스닝 집중 훈련", "관심 주제로 리딩·라이팅 연습", "실전 스피킹 & 모의 테스트"],
    "중상급": ["고급 표현 & 뉘앙스 학습", "다양한 주제 리스닝·리딩 훈련", "논리적인 글쓰기 & 의견 말하기", "실전 프레젠테이션 & 토론 연습"],
    "고급": ["원어민 수준 표현 다듬기", "전문 분야 콘텐츠로 심화 학습", "긴 글쓰기 & 발표 준비", "실전 활용 & 유창성 강화"]
  };

  var LEVEL_DAILY_PATTERN = {
    "왕초보": ["단어 암기", "기초 문법", "단어 암기", "리스닝", "기초 문법", "관심분야 학습", "복습"],
    "초급": ["단어 암기", "문법", "리스닝", "리딩", "스피킹", "관심분야 학습", "복습"],
    "중급": ["리스닝", "리딩", "스피킹", "문법", "라이팅", "관심분야 학습", "복습"],
    "중상급": ["리스닝", "라이팅", "스피킹", "리딩", "토론 연습", "관심분야 학습", "실전 테스트"],
    "고급": ["리스닝(고속)", "라이팅(에세이)", "스피킹(발표)", "리딩(전문자료)", "토론 연습", "관심분야 학습", "실전 테스트"]
  };

  var DAY_LABELS = ["월", "화", "수", "목", "금", "토", "일"];

  var LEVEL_TIP = {
    "왕초보": "처음이라도 걱정하지 마세요! 매일 조금씩 쌓아가면 충분히 자신감을 얻을 수 있어요.",
    "초급": "기초는 다졌으니 이제 실제 상황에서 써먹는 연습을 시작해보세요.",
    "중급": "어느 정도 익숙해진 만큼, 관심 분야 콘텐츠로 실전 감각을 키워보세요.",
    "중상급": "조금만 더 다듬으면 고급 레벨이에요. 뉘앙스와 표현력에 집중해보세요.",
    "고급": "이미 실력이 탄탄하니 실전 활용과 유창성 강화에 집중해보세요."
  };

  var CAREER_LABELS = {
    none: "거의 없음", under1: "1년 미만", "1to3": "1~3년", "3to5": "3~5년", over5: "5년 이상"
  };

  var CAREER_NOTE = {
    none: "영어 공부가 처음이어도 괜찮아요, 차근차근 시작해봐요.",
    under1: "이제 막 시작한 단계이니 기초를 탄탄히 다지는 데 집중해보세요.",
    "1to3": "어느 정도 경험이 있으니 실전 회화와 활용에 집중해보세요.",
    "3to5": "꾸준히 해온 만큼, 부족한 영역을 집중적으로 보완해보세요.",
    over5: "오랜 경험이 있으니 유지 및 심화 학습 위주로 구성해보세요."
  };

  function getAgeGroupInfo(age) {
    if (age <= 19) {
      return { time: "하루 60분", tip: "학교 수업이 끝난 저녁 시간에 집중적으로 학습하는 걸 추천해요." };
    } else if (age <= 39) {
      return { time: "하루 30~40분", tip: "출퇴근 시간이나 점심시간을 활용해 짧고 꾸준하게 학습해보세요." };
    } else {
      return { time: "하루 30분", tip: "아침 시간을 활용해 부담 없이 꾸준한 루틴을 만들어보세요." };
    }
  }

  function levelFromScore(score) {
    if (score < 400) return "왕초보";
    if (score < 550) return "초급";
    if (score < 730) return "중급";
    if (score < 860) return "중상급";
    return "고급";
  }

  function levelFromCareer(career) {
    switch (career) {
      case "none":
      case "under1": return "초급";
      case "1to3": return "중급";
      case "3to5": return "중상급";
      case "over5": return "고급";
      default: return "초급";
    }
  }

  // ---------- Render interest checkboxes ----------
  var grid = document.getElementById("interest-grid");
  var counterEl = document.getElementById("interest-counter");

  INTERESTS.forEach(function (name, idx) {
    var label = document.createElement("label");
    label.className = "interest-item";
    label.innerHTML = '<input type="checkbox" value="' + idx + '"> <span>' + name + "</span>";
    grid.appendChild(label);

    var checkbox = label.querySelector("input");
    checkbox.addEventListener("change", function () {
      var checkedCount = grid.querySelectorAll("input:checked").length;
      if (checkbox.checked && checkedCount > MAX_INTERESTS) {
        checkbox.checked = false;
        showError("관심 분야는 최대 " + MAX_INTERESTS + "개까지 선택할 수 있어요.");
        return;
      }
      label.classList.toggle("checked", checkbox.checked);
      checkedCount = grid.querySelectorAll("input:checked").length;
      counterEl.textContent = "선택: " + checkedCount + " / " + MAX_INTERESTS;
    });
  });

  function getSelectedInterests() {
    var boxes = grid.querySelectorAll("input:checked");
    var result = [];
    boxes.forEach(function (box) {
      result.push(INTERESTS[parseInt(box.value, 10)]);
    });
    return result;
  }

  // ---------- Validation ----------
  var errorBox = document.getElementById("error-box");
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }
  function hideError() {
    errorBox.style.display = "none";
  }

  // ---------- Plan generation ----------
  function generatePlan(input) {
    var level;
    if (input.score !== null) {
      level = levelFromScore(input.score);
    } else {
      level = levelFromCareer(input.career);
    }

    var ageInfo = getAgeGroupInfo(input.age);
    var themes = LEVEL_WEEK_THEMES[level];
    var pattern = LEVEL_DAILY_PATTERN[level];

    var weeks = [];
    for (var w = 0; w < 4; w++) {
      var days = [];
      for (var d = 0; d < 7; d++) {
        days.push({ label: DAY_LABELS[d], activity: pattern[d] });
      }
      var notes = input.interests.map(function (interest) {
        var arr = interestActivities[interest] || [];
        return { interest: interest, text: arr[w] || arr[arr.length - 1] };
      });
      weeks.push({ weekNum: w + 1, theme: themes[w], days: days, notes: notes });
    }

    return {
      age: input.age,
      score: input.score,
      career: input.career,
      interests: input.interests,
      level: level,
      ageInfo: ageInfo,
      weeks: weeks
    };
  }

  // ---------- Render result ----------
  function renderResult(plan) {
    var summary = document.getElementById("result-summary");
    var scoreText = plan.score !== null ? plan.score + "점" : "점수 없음";
    var careerText = CAREER_LABELS[plan.career];

    var html = "";
    html += '<span class="level-badge">' + plan.level + '</span>';
    html += '<div class="summary-row">';
    html += '<span class="chip">나이 ' + plan.age + '세</span>';
    html += '<span class="chip">토익 ' + scoreText + '</span>';
    html += '<span class="chip">경력 ' + careerText + '</span>';
    html += '<span class="chip">추천 학습 시간 ' + plan.ageInfo.time + '</span>';
    html += '</div>';
    html += '<div class="summary-row">';
    plan.interests.forEach(function (i) {
      html += '<span class="chip">' + i + '</span>';
    });
    html += '</div>';
    html += '<p class="tip-text">' + LEVEL_TIP[plan.level] + '</p>';
    html += '<p class="tip-text">' + CAREER_NOTE[plan.career] + '</p>';
    html += '<p class="tip-text">' + plan.ageInfo.tip + '</p>';
    summary.innerHTML = html;

    var weeksContainer = document.getElementById("weeks-container");
    weeksContainer.innerHTML = "";

    plan.weeks.forEach(function (week) {
      var card = document.createElement("div");
      card.className = "card week-card";

      var tableRows1 = "<tr>";
      var tableRows2 = "<tr>";
      week.days.forEach(function (d) {
        tableRows1 += "<th>" + d.label + "</th>";
        tableRows2 += "<td>" + d.activity + "</td>";
      });
      tableRows1 += "</tr>";
      tableRows2 += "</tr>";

      var notesHtml = "";
      week.notes.forEach(function (n) {
        notesHtml += "<div>🔹 <strong>[" + n.interest + "]</strong> " + n.text + "</div>";
      });

      card.innerHTML =
        '<div class="week-title">' + week.weekNum + '주차</div>' +
        '<div class="week-theme">' + week.theme + '</div>' +
        '<table class="day-table"><thead>' + tableRows1 + '</thead><tbody>' + tableRows2 + '</tbody></table>' +
        (notesHtml ? '<div class="interest-note">' + notesHtml + '</div>' : '');

      weeksContainer.appendChild(card);
    });
  }

  // ---------- Events ----------
  document.getElementById("submit-btn").addEventListener("click", function () {
    hideError();

    var ageVal = document.getElementById("age-input").value;
    var scoreVal = document.getElementById("toeic-input").value;
    var career = document.getElementById("career-input").value;
    var interests = getSelectedInterests();

    if (!ageVal || isNaN(ageVal) || Number(ageVal) < 5 || Number(ageVal) > 100) {
      showError("나이를 5~100 사이의 숫자로 입력해주세요.");
      return;
    }
    var age = Number(ageVal);

    var score = null;
    if (scoreVal !== "") {
      if (isNaN(scoreVal) || Number(scoreVal) < 0 || Number(scoreVal) > 990) {
        showError("토익 점수는 0~990 사이의 숫자로 입력해주세요.");
        return;
      }
      score = Number(scoreVal);
    }

    if (interests.length < 1) {
      showError("관심 분야를 최소 1개 이상 선택해주세요.");
      return;
    }
    if (interests.length > MAX_INTERESTS) {
      showError("관심 분야는 최대 " + MAX_INTERESTS + "개까지 선택할 수 있어요.");
      return;
    }

    var plan = generatePlan({ age: age, score: score, career: career, interests: interests });
    renderResult(plan);

    document.getElementById("input-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    window.scrollTo(0, 0);
  });

  document.getElementById("restart-btn").addEventListener("click", function () {
    document.getElementById("age-input").value = "";
    document.getElementById("toeic-input").value = "";
    document.getElementById("career-input").value = "none";
    grid.querySelectorAll("input:checked").forEach(function (box) {
      box.checked = false;
      box.closest(".interest-item").classList.remove("checked");
    });
    counterEl.textContent = "선택: 0 / " + MAX_INTERESTS;
    hideError();

    document.getElementById("result-screen").style.display = "none";
    document.getElementById("input-screen").style.display = "block";
    window.scrollTo(0, 0);
  });
})();
</script>
